packages:
  # List each pnpm-managed subproject (one per line). Common examples:
  - frontend
  - portal
  # Shared packages folder (delete if you don't have one):
  - packages/*
  # The cognitive-complexity sidecar used by tools/code_health:
  - tools/code_health/cognitive

# Packages allowed to run install scripts. Keep this minimal.
# Example: native deps that have a postinstall step.
onlyBuiltDependencies:
  - "esbuild"
