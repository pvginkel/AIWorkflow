# The environment for the AI workflow.
# Schema: https://kubecoder.home/help/reference/config-yaml/
#
# AIWorkflow needs almost nothing: it is a plugin marketplace, nothing is built
# or deployed from it, and its suites and ruff run straight out of the python
# toolchain (see .kubecoder/project.yaml).

repos:
  # AIWorkflow's own spec repo — for now, the Trello Triage cards archived at the
  # YouTrack cutover. Shared, like every spec repo: parallel sessions read and
  # append to the one working tree.
  - url: https://github.com/pvginkel/AIWorkflowSpecs
    shared: true
  # The kubecoder plugin marketplace: the host conventions the dev plugin's
  # skills load (youtrack-usage above all) change with the plugin often.
  - url: https://github.com/pvginkel/KubeCoderConfig
  # The hub of https://dev-guides.home/, public: the index page, the root
  # llms.txt, the shared guide checker tools/check_guide.py, and the one Jenkins
  # job, DevGuides, that builds and publishes every guide. Its `kc project test`
  # builds the hub over the three working trees under /work.
  - url: https://github.com/pvginkel/DevGuides
  # The private guides, published under dev-guides.home: data modelling, which
  # derives from a copyrighted course.
  - url: https://github.com/pvginkel/DevGuidesPrivate
  # The source of the Jenkins guide (docs/), published at
  # https://dev-guides.home/pipelines/. Here because the hub builds over it; the
  # Ansible environment clones it too, so pull before working.
  - url: https://github.com/pvginkel/JenkinsPipelineUtils

capabilities:
  github: rw
  fleetAdmin: true

# DevGuides' `kc project build` runs kaniko --no-push, the image its Jenkins job builds.
imageBuilder: true

tools:
  # The plugin's suites and ruff; the dev container has no uv.
  - use: python
  # KubeCoderConfig's setup and Prettier gate run npm here (its project.yaml).
  - use: frontend
  # The dev-guides.home build (AIWF-81) runs here end to end, the hosting side included, so this
  # environment carries the toolchains the other repos' gates name: JenkinsPipelineUtils' Maven
  # and offline check (java) and its docs verbs (iac); the deploy repos' Helm and Terraform (iac)
  # and their chart-deps and architecture commands (aac-tools); Architecture's Poetry gate
  # (modern-app).
  - use: java
  - use: iac
  - use: aac-tools
  - use: modern-app

preamble:
  instructions: |
    The AI workflow's environment: the `dev` plugin marketplace
    (/work/AIWorkflow, with its spec repo in /work/AIWorkflowSpecs), and
    the `kubecoder` plugin marketplace in /work/KubeCoderConfig, and the
    dev-guides.home repos: the hub in /work/DevGuides, the private guides in
    /work/DevGuidesPrivate, and the Jenkins guide's source in
    /work/JenkinsPipelineUtils.

    Toolchain sidecars:

      cexec python      Python with uv. There is no uv in the dev container.
      cexec frontend    Node with npm, for KubeCoderConfig's Prettier gate.
      cexec java        JDK and Maven, for JenkinsPipelineUtils' gates.
      cexec iac         Helm, Terraform and uv, for JenkinsPipelineUtils'
                        docs verbs and the deploy repos' gates.
      cexec aac-tools   chart-deps, gen-architecture, arch-validate.
      cexec modern-app  Node and Poetry, for Architecture's gates.

    `kc project` verbs are cwd-bound, so run them from the repo's root.

    The `dev` plugin this environment's sessions load is the INSTALLED one,
    from the marketplace's git URL — not the working tree in
    /work/AIWorkflow. An edit there changes no running pipeline until it is
    pushed and the plugin updated.

    /work/AIWorkflowSpecs is a SHARED working tree: stage files by name
    there, never `git add -A`.
