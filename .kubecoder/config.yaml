# The environment for the AI workflow.
# Schema: https://kubecoder.home/help/reference/config-yaml/
#
# AIWorkflow needs almost nothing: it is a plugin marketplace, nothing is built
# or deployed from it, and its suites and ruff run straight out of the python
# toolchain (see .kubecoder/project.yaml).

repos:
  # AIWorkflow's own spec repo — for now, the Trello Triage cards archived at the
  # YouTrack cutover. Shared, like every spec repo: parallel sessions read and
  # append to the one working tree.
  - url: https://github.com/pvginkel/AIWorkflowSpecs
    shared: true

capabilities:
  github: rw
  fleetAdmin: true

tools:
  # The plugin's suites and ruff; the dev container has no uv.
  - use: python

preamble:
  instructions: |
    The AI workflow's environment: the `dev` plugin marketplace
    (/work/AIWorkflow, with its spec repo in /work/AIWorkflowSpecs).

    One toolchain sidecar:

      cexec python    Python with uv. There is no uv in the dev container.

    `kc project` verbs are cwd-bound, so run them from the repo's root.

    The `dev` plugin this environment's sessions load is the INSTALLED one,
    from the marketplace's git URL — not the working tree in
    /work/AIWorkflow. An edit there changes no running pipeline until it is
    pushed and the plugin updated.

    /work/AIWorkflowSpecs is a SHARED working tree: stage files by name
    there, never `git add -A`.
